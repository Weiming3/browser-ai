name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    # 测试里读取 %APPDATA%（Firefox cookie 路径），因此跑在 windows runner 上
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest playwright
      - name: Run smoke tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests/test_smoke.py -v
